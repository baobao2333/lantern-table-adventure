name: Windows desktop release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing version tag to rebuild and publish (empty builds only)"
        required: false
        type: string
  push:
    tags: ["v*"]
permissions:
  contents: write
concurrency:
  group: windows-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - run: npm ci
      - name: Check release version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:RELEASE_TAG) {
            node scripts/check-release-version.mjs --tag $env:RELEASE_TAG
          } else {
            node scripts/check-release-version.mjs
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release version check failed.' }
      - run: npm run content:check
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build:local
      - run: node scripts/verify-local.mjs
      - run: node scripts/build-desktop.mjs --skip-local
      - name: Package with optional trusted Windows certificate
        shell: pwsh
        env:
          LANTERN_SIGN_REQUIRED: ${{ vars.LANTERN_SIGN_REQUIRED || '0' }}
          LANTERN_WINDOWS_PFX_BASE64: ${{ secrets.LANTERN_WINDOWS_PFX_BASE64 }}
          LANTERN_WINDOWS_PFX_PASSWORD: ${{ secrets.LANTERN_WINDOWS_PFX_PASSWORD }}
          LANTERN_SIGN_TIMESTAMP_URL: ${{ vars.LANTERN_SIGN_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $certificateFile = Join-Path $env:RUNNER_TEMP 'lantern-code-signing.pfx'
          $importedCertificates = @()
          try {
            if ($env:LANTERN_WINDOWS_PFX_BASE64) {
              if (-not $env:LANTERN_WINDOWS_PFX_PASSWORD) { throw 'The signing PFX password Secret is missing.' }
              [IO.File]::WriteAllBytes($certificateFile, [Convert]::FromBase64String($env:LANTERN_WINDOWS_PFX_BASE64))
              $password = ConvertTo-SecureString -String $env:LANTERN_WINDOWS_PFX_PASSWORD -AsPlainText -Force
              $importedCertificates = @(Import-PfxCertificate -FilePath $certificateFile -CertStoreLocation 'Cert:\CurrentUser\My' -Password $password)
              $publisher = @($importedCertificates | Where-Object { $_.HasPrivateKey -and '1.3.6.1.5.5.7.3.3' -in $_.EnhancedKeyUsageList.ObjectId })
              if ($publisher.Count -ne 1) { throw 'The PFX must contain exactly one code-signing private key.' }
              $env:LANTERN_SIGN_CERTIFICATE_THUMBPRINT = $publisher[0].Thumbprint
              $env:LANTERN_SIGN_REQUIRED = '1'
            } elseif ($env:LANTERN_WINDOWS_PFX_PASSWORD) {
              throw 'The signing PFX Secret is missing.'
            }
            Remove-Item Env:\LANTERN_WINDOWS_PFX_BASE64 -ErrorAction SilentlyContinue
            Remove-Item Env:\LANTERN_WINDOWS_PFX_PASSWORD -ErrorAction SilentlyContinue
            if (Test-Path -LiteralPath $certificateFile) { Remove-Item -LiteralPath $certificateFile -Force }
            & npm run release:desktop
            if ($LASTEXITCODE -ne 0) { throw 'Desktop packaging or trusted-signature verification failed.' }
          } finally {
            if (Test-Path -LiteralPath $certificateFile) { Remove-Item -LiteralPath $certificateFile -Force }
            foreach ($certificate in $importedCertificates) {
              Remove-Item -LiteralPath "Cert:\CurrentUser\My\$($certificate.Thumbprint)" -DeleteKey -ErrorAction SilentlyContinue
            }
          }
      - run: npm run verify:desktop
      - run: npm run release:signal
      - run: node scripts/release-notes.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lantern-table-windows-x64
          path: |
            dist/desktop/release/*
            dist/release/*.zip
            dist/release/*.zip.sha256
          if-no-files-found: error
          include-hidden-files: false
      - name: Publish formal GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = if ($env:RELEASE_TAG) { $env:RELEASE_TAG } else { $env:GITHUB_REF.Substring(10) }
          $version = (Get-Content -LiteralPath 'package.json' -Raw | ConvertFrom-Json).version
          if ($tag -ne "v$version") { throw 'Release tag must match the checked-out package version.' }
          $preview = $tag.Contains('-')
          [string[]]$releaseFlags = if ($preview) { @('--prerelease') } else { @('--prerelease=false') }
          $null = & gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            & gh release create $tag --repo $env:GITHUB_REPOSITORY --verify-tag --draft @releaseFlags --title "灯火之下 $tag" --notes-file 'dist/release/RELEASE_NOTES.md'
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
          }
          $assets = @(Get-ChildItem -LiteralPath 'dist/desktop/release' -File) + @(Get-ChildItem -LiteralPath 'dist/release' -File | Where-Object { $_.Name -like '*.zip' -or $_.Name -like '*.zip.sha256' })
          if ($assets.Count -eq 0) { throw 'No verified release assets were found.' }
          $uploadArguments = @('release', 'upload', $tag, '--repo', $env:GITHUB_REPOSITORY, '--clobber') + @($assets.FullName)
          & gh @uploadArguments
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
          & gh release edit $tag --repo $env:GITHUB_REPOSITORY --verify-tag --draft=false @releaseFlags --title "灯火之下 $tag" --notes-file 'dist/release/RELEASE_NOTES.md'
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
